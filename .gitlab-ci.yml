# .gitlab-ci.yml - GitLab CI for the Factory Data GUI (factory-data-gui).
#
# Mirrors ./Jenkinsfile: Checkout -> Setup -> Check -> Lint -> Tests -> Package -> Release (tags).
#
# Pure Python; the GUI never starts for real. Tests run headless with
# QT_QPA_PLATFORM=offscreen, and the package job needs PyInstaller.
#
# Set the CI/CD variable GITHUB_RELEASE_TOKEN (masked, protected) to
# publish a v<version> tag build as a GitHub release.

stages:
  - check
  - test
  - package
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"
  VENV: ".venv"
  QT_QPA_PLATFORM: "offscreen"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.12-slim
  interruptible: true
  before_script:
    - python3 --version
    - |
      python3 -m venv "$VENV"
    - |
      "$VENV/bin/python" -m pip install --upgrade pip
    - |
      "$VENV/bin/python" -m pip install -r requirements.txt pytest ruff
    - |
      "$VENV/bin/python" -m pip list

check:
  stage: check
  script:
    - |
      make check PYTHON="$VENV/bin/python"

lint:
  stage: check
  script:
    - |
      "$VENV/bin/python" -m pip install ruff
    - |
      make lint PYTHON="$VENV/bin/python"

test:
  stage: test
  script:
    - |
      make test PYTHON="$VENV/bin/python"

package:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - |
      "$VENV/bin/python" -m pip install pyinstaller
    - |
      rm -rf dist
    - |
      make dist PYTHON="$VENV/bin/python"
    - |
      mkdir -p dist
    - |
      files="factory_data_gui.py factory_data_cli.py core gui requirements.txt README.md LICENSE"
    - |
      if [ -n "$(ls -A dist 2>/dev/null)" ]; then files="$files dist"; fi
    - |
      python3 ci/package.py --name factory-data-gui --version "$(ci/version.sh)" $files
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release:
  stage: release
  needs: [package]
  rules:
    - if: '$CI_COMMIT_TAG && $GITHUB_RELEASE_TOKEN'
  script:
    - |
      GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN" python3 ci/github_release.py --tag "$CI_COMMIT_TAG" --version "$(ci/version.sh)" dist/*
